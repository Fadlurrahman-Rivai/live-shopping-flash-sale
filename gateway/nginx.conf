upstream api_backend      { server api:3000; }
upstream realtime_backend { server realtime:4000; }
upstream media_backend    { server media:5000; }
upstream frontend_backend { server frontend:80; }

server {
  listen 80;
  server_name _;

  # Pass real client IP to upstream services
  proxy_set_header X-Real-IP       $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Host            $host;

  # WebSocket upgrade — must be defined before /api to avoid prefix clash
  location /ws {
    proxy_pass         http://realtime_backend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # REST API — strip /api prefix before forwarding
  location /api/ {
    proxy_pass http://api_backend/;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Media control-plane — strip /media prefix before forwarding
  location /media/ {
    proxy_pass http://media_backend/;
  }

  # SPA frontend — catch-all with fallback to index.html
  location / {
    proxy_pass http://frontend_backend;
  }
}
