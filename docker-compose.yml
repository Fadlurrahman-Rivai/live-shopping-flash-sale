services:
  gateway:
    image: nginx:1.27-alpine
    container_name: live-shopping-gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
      - realtime
      - media
    restart: unless-stopped
    networks:
      - live-shopping-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-shopping-frontend
    restart: unless-stopped
    networks:
      - live-shopping-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: live-shopping-api
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/live_shopping
      REALTIME_INTERNAL_URL: http://realtime:4000
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      realtime:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - live-shopping-network

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    container_name: live-shopping-realtime
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      API_INTERNAL_URL: http://api:3000
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - live-shopping-network

  media:
    build:
      context: ./media
      dockerfile: Dockerfile
    container_name: live-shopping-media
    environment:
      PORT: 5000
    restart: unless-stopped
    networks:
      - live-shopping-network

  postgres:
    image: postgres:16-alpine
    container_name: live-shopping-postgres
    environment:
      POSTGRES_DB: live_shopping
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d live_shopping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - live-shopping-network

  redis:
    image: redis:7-alpine
    container_name: live-shopping-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    networks:
      - live-shopping-network

volumes:
  postgres-data:

networks:
  live-shopping-network:
    name: live-shopping-network